name: momo 開檔快照

on:
  schedule:
    # UTC 時間（台灣 = UTC+8）
    - cron: '1 16 * * *'   # 00:00 OPEN → 台灣 00:01
    - cron: '1 23 * * *'   # 07:00 OPEN → 台灣 07:01
    - cron: '1 3 * * *'    # 11:00 OPEN → 台灣 11:01
    - cron: '1 6 * * *'    # 14:00 OPEN → 台灣 14:01
    - cron: '1 10 * * *'   # 18:00 OPEN → 台灣 18:01
    - cron: '1 14 * * *'   # 22:00 OPEN → 台灣 22:01

  workflow_dispatch:

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install playwright

      - name: 安裝 Playwright 瀏覽器
        run: playwright install chromium --with-deps

      - name: 建立 snapshots 資料夾
        run: mkdir -p snapshots

      - name: 執行開檔快照
        run: python momo_scraper.py open

      - name: 存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git stash
          git pull --rebase
          git stash pop
          git add snapshots/
          git diff --staged --quiet || git commit -m "自動更新：$(date +'%Y/%m/%d %H:%M') open"
          git push

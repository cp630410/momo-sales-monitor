name: momo 限時搶購監控

on:
  schedule:
    # UTC 時間（台灣 = UTC+8）
    # 每個時段結束前 15 分鐘執行
    # 同時完成：當前時段 CLOSE + 下一時段 OPEN + 成效計算
    - cron: '45 22 * * *'  # 台灣 06:45（00:00 檔結束前15分）
    - cron: '45 2 * * *'   # 台灣 10:45（07:00 檔結束前15分）
    - cron: '45 5 * * *'   # 台灣 13:45（11:00 檔結束前15分）
    - cron: '45 9 * * *'   # 台灣 17:45（14:00 檔結束前15分）
    - cron: '45 13 * * *'  # 台灣 21:45（18:00 檔結束前15分）
    - cron: '45 15 * * *'  # 台灣 23:45（22:00 檔結束前15分）

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install playwright

      - name: 安裝 Playwright 瀏覽器
        run: playwright install chromium --with-deps

      - name: 建立 snapshots 資料夾
        run: mkdir -p snapshots

      - name: 抓取（當前時段 CLOSE + 下一時段 OPEN）
        run: python momo_scraper.py

      - name: 計算當前時段成效
        run: python compare_snapshots.py

      - name: 存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git pull --rebase --autostash
          git diff --staged --quiet || git commit -m "自動更新：$(date +'%Y/%m/%d %H:%M')"
          git push

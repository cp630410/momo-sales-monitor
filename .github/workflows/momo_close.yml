name: momo 結束快照與成效計算

on:
  schedule:
    # UTC 時間（台灣 = UTC+8）
    # close 設定為結束前 30 分鐘，確保不被換檔影響
    - cron: '30 22 * * *'  # 00:00 CLOSE → 台灣 06:30
    - cron: '30 2 * * *'   # 07:00 CLOSE → 台灣 10:30
    - cron: '30 5 * * *'   # 11:00 CLOSE → 台灣 13:30
    - cron: '30 9 * * *'   # 14:00 CLOSE → 台灣 17:30
    - cron: '30 13 * * *'  # 18:00 CLOSE → 台灣 21:30
    - cron: '30 15 * * *'  # 22:00 CLOSE → 台灣 23:30

  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install playwright

      - name: 安裝 Playwright 瀏覽器
        run: playwright install chromium --with-deps

      - name: 建立 snapshots 資料夾
        run: mkdir -p snapshots

      - name: 執行結束前快照
        run: python momo_scraper.py close

      - name: 自動計算成效
        run: python compare_snapshots.py

      - name: 存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          git pull --rebase --autostash
          git diff --staged --quiet || git commit -m "自動更新：$(date +'%Y/%m/%d %H:%M') close"
          git push

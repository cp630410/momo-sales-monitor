name: momo 限時搶購自動監控

on:
  schedule:
    # UTC 時間（台灣 UTC+8，需減 8 小時）
    # ── 開檔快照：時段開始後 1 分鐘 ──────────────────
    - cron: '1 16 * * *'   # 00:00 OPEN  → 台灣 00:01
    - cron: '1 23 * * *'   # 07:00 OPEN  → 台灣 07:01
    - cron: '1 3 * * *'    # 11:00 OPEN  → 台灣 11:01
    - cron: '1 6 * * *'    # 14:00 OPEN  → 台灣 14:01
    - cron: '1 10 * * *'   # 18:00 OPEN  → 台灣 18:01
    - cron: '1 14 * * *'   # 22:00 OPEN  → 台灣 22:01

    # ── 結束前快照：時段結束前 5 分鐘 ────────────────
    - cron: '55 22 * * *'  # 00:00 CLOSE → 台灣 06:55（06:59 結束前5分）
    - cron: '55 2 * * *'   # 07:00 CLOSE → 台灣 10:55（10:59 結束前5分）
    - cron: '55 5 * * *'   # 11:00 CLOSE → 台灣 13:55（13:59 結束前5分）
    - cron: '55 9 * * *'   # 14:00 CLOSE → 台灣 17:55（17:59 結束前5分）
    - cron: '55 13 * * *'  # 18:00 CLOSE → 台灣 21:55（21:59 結束前5分）
    - cron: '55 15 * * *'  # 22:00 CLOSE → 台灣 23:55（23:59 結束前5分）

    # ── 每月清理：第二週週日 02:00 台灣時間 ──────────
    - cron: '0 18 8-14 * 0'

  workflow_dispatch:
    inputs:
      action:
        description: '執行動作'
        required: true
        default: 'open'
        type: choice
        options:
          - open
          - close
          - cleanup

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件
        run: pip install playwright

      - name: 安裝 Playwright 瀏覽器核心
        run: playwright install chromium --with-deps

      - name: 建立 snapshots 資料夾
        run: mkdir -p snapshots

      - name: 判斷執行動作
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
          else
            MIN=$(date -u +%M)
            DAY=$(date -u +%d)
            DOW=$(date -u +%u)
            if [ "$DOW" = "7" ] && [ "$DAY" -ge 8 ] && [ "$DAY" -le 14 ]; then
              echo "ACTION=cleanup" >> $GITHUB_ENV
            elif [ "$MIN" = "01" ]; then
              echo "ACTION=open" >> $GITHUB_ENV
            elif [ "$MIN" = "55" ]; then
              echo "ACTION=close" >> $GITHUB_ENV
            else
              echo "ACTION=open" >> $GITHUB_ENV
            fi
          fi

      - name: 執行抓取（open）
        if: env.ACTION == 'open'
        run: python momo_scraper.py open

      - name: 執行抓取（close）
        if: env.ACTION == 'close'
        run: python momo_scraper.py close

      - name: close 完成後自動計算成效
        if: env.ACTION == 'close'
        run: python compare_snapshots.py

      - name: 每月清理上個月快照
        if: env.ACTION == 'cleanup'
        run: python cleanup.py

      - name: 把結果存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add snapshots/
          git diff --staged --quiet || git commit -m "自動更新：$(date +'%Y/%m/%d %H:%M') $ACTION"
          git push

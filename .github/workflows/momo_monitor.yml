name: momo 限時搶購自動監控

on:
  schedule:
    # ── 每日六個時段（UTC，台灣 = UTC+8）──────────────
    - cron: '1 16 * * *'   # 00:00 OPEN  （台灣 00:01）
    - cron: '49 22 * * *'  # 00:00 CLOSE （台灣 06:49）
    - cron: '1 23 * * *'   # 07:00 OPEN  （台灣 07:01）
    - cron: '49 2 * * *'   # 07:00 CLOSE （台灣 10:49）
    - cron: '1 3 * * *'    # 11:00 OPEN  （台灣 11:01）
    - cron: '49 5 * * *'   # 11:00 CLOSE （台灣 13:49）
    - cron: '1 6 * * *'    # 14:00 OPEN  （台灣 14:01）
    - cron: '49 9 * * *'   # 14:00 CLOSE （台灣 17:49）
    - cron: '1 10 * * *'   # 18:00 OPEN  （台灣 18:01）
    - cron: '49 13 * * *'  # 18:00 CLOSE （台灣 21:49）
    - cron: '1 14 * * *'   # 22:00 OPEN  （台灣 22:01）
    - cron: '49 15 * * *'  # 22:00 CLOSE （台灣 23:49）

    # ── 每月清理：第二週週日 02:00 台灣時間 ────────────
    # UTC 18:00（前一天）= 台灣 02:00
    # 每月 8~14 日之間的週日（= 第二週週日）
    - cron: '0 18 8-14 * 0'

  workflow_dispatch:
    inputs:
      action:
        description: '執行動作'
        required: true
        default: 'open'
        type: choice
        options:
          - open
          - close
          - cleanup

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件
        run: pip install playwright

      - name: 安裝 Playwright 瀏覽器核心
        run: playwright install chromium --with-deps

      - name: 建立 snapshots 資料夾
        run: mkdir -p snapshots

      - name: 判斷執行動作
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV

          elif [ "${{ github.event_name }}" = "schedule" ]; then
            MIN=$(date -u +%M)
            DAY=$(date -u +%d)
            DOW=$(date -u +%u)  # 1=Mon, 7=Sun

            # 第二週週日（8~14日 且 週日）→ cleanup
            if [ "$DOW" = "7" ] && [ "$DAY" -ge 8 ] && [ "$DAY" -le 14 ]; then
              echo "ACTION=cleanup" >> $GITHUB_ENV
            elif [ "$MIN" = "01" ]; then
              echo "ACTION=open" >> $GITHUB_ENV
            elif [ "$MIN" = "49" ]; then
              echo "ACTION=close" >> $GITHUB_ENV
            else
              echo "ACTION=open" >> $GITHUB_ENV
            fi
          fi

      - name: 執行抓取（open）
        if: env.ACTION == 'open'
        run: python momo_scraper.py open

      - name: 執行抓取（close）
        if: env.ACTION == 'close'
        run: python momo_scraper.py close

      - name: close 完成後自動計算成效
        if: env.ACTION == 'close'
        run: python compare_snapshots.py

      - name: 每月清理上個月快照
        if: env.ACTION == 'cleanup'
        run: python cleanup.py

      - name: 把結果存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add snapshots/
          git diff --staged --quiet || git commit -m "自動更新：$(date +'%Y/%m/%d %H:%M') $ACTION"
          git push

name: momo 限時搶購自動監控

on:
  schedule:
    # UTC 時間（台灣 UTC+8，需減 8 小時）
    # 00:00 檔 OPEN  → UTC 16:01
    - cron: '1 16 * * *'
    # 00:00 檔 CLOSE → UTC 22:49
    - cron: '49 22 * * *'
    # 07:00 檔 OPEN  → UTC 23:01
    - cron: '1 23 * * *'
    # 07:00 檔 CLOSE → UTC 02:49
    - cron: '49 2 * * *'
    # 11:00 檔 OPEN  → UTC 03:01
    - cron: '1 3 * * *'
    # 11:00 檔 CLOSE → UTC 05:49
    - cron: '49 5 * * *'
    # 14:00 檔 OPEN  → UTC 06:01
    - cron: '1 6 * * *'
    # 14:00 檔 CLOSE → UTC 09:49
    - cron: '49 9 * * *'
    # 18:00 檔 OPEN  → UTC 10:01
    - cron: '1 10 * * *'
    # 18:00 檔 CLOSE → UTC 13:49
    - cron: '49 13 * * *'
    # 22:00 檔 OPEN  → UTC 14:01
    - cron: '1 14 * * *'
    # 22:00 檔 CLOSE → UTC 15:49
    - cron: '49 15 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: '執行動作'
        required: true
        default: 'open'
        type: choice
        options:
          - open
          - close

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Python 套件
        run: pip install playwright

      - name: 安裝 Playwright 瀏覽器核心
        run: playwright install chromium --with-deps

      - name: 建立 snapshots 資料夾
        run: mkdir -p snapshots

      - name: 判斷執行動作
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
          else
            MIN=$(date -u +%M)
            if [ "$MIN" = "01" ]; then
              echo "ACTION=open" >> $GITHUB_ENV
            else
              echo "ACTION=close" >> $GITHUB_ENV
            fi
          fi

      - name: 執行抓取
        run: |
          echo "執行動作：$ACTION"
          python momo_scraper.py $ACTION

      - name: 若是 close 則自動計算成效
        if: env.ACTION == 'close'
        run: python compare_snapshots.py

      - name: 把結果存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add snapshots/
          git diff --staged --quiet || git commit -m "自動更新：$(date +'%Y/%m/%d %H:%M') $ACTION"
          git push
